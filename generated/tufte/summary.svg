<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 255" width="465" height="255">
  <style>
    .serif { font-family: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, serif; }
    .num { font-family: Georgia, serif; font-variant-numeric: tabular-nums; }
    .h1 { font-size: 13.5px; font-weight: bold; fill: #526071; }
    .sub { font-size: 10px; font-style: italic; fill: #64748b; }
    .sec { font-size: 10px; font-style: italic; font-weight: bold; fill: #0284c7; }
    .lbl { font-size: 10px; fill: #526071; }
    .val { font-size: 10px; font-weight: bold; fill: #526071; }
  </style>
  <text x="14" y="22" class="serif h1">Pablo Diego — Data Scientist &amp; Analytics Engineer</text>
  <text x="451" y="22" text-anchor="end" class="num sub">32 Repos · ★ 342</text>
  <line x1="14" y1="30" x2="451" y2="30" stroke="#64748b" stroke-opacity="0.7" stroke-width="0.8"/>

  <!-- Q1: Languages (Dot-Dash Plot) -->
  <g transform="translate(14, 46)">
    <text x="0" y="0" class="serif sec">1. True Source Code Proportions</text>
    <text x="0" y="18" class="serif lbl">Python</text>
    <line x1="58" y1="14" x2="139" y2="14" stroke="#64748b" stroke-width="1.1"/>
    <circle cx="139" cy="14" r="2.5" fill="#0284c7"/>
    <text x="200" y="18" text-anchor="end" class="num val" fill="#0284c7">58.4%</text>
    <text x="0" y="34" class="serif lbl">SQL</text>
    <line x1="58" y1="30" x2="84" y2="30" stroke="#64748b" stroke-width="1.1"/>
    <circle cx="84" cy="30" r="2.5" fill="#d97706"/>
    <text x="200" y="34" text-anchor="end" class="num val">19.2%</text>
    <text x="0" y="50" class="serif lbl">Go</text>
    <line x1="58" y1="46" x2="74" y2="46" stroke="#64748b" stroke-width="1.1"/>
    <circle cx="74" cy="46" r="2.5" fill="#00ADD8"/>
    <text x="200" y="50" text-anchor="end" class="num val">11.8%</text>
    <text x="0" y="66" class="serif lbl">Exploration vs. Production</text>
    <text x="200" y="66" text-anchor="end" class="num val" fill="#059669">62% Prod / 38% EDA</text>
  </g>

  <!-- Q2: Stack (Supertable) -->
  <g transform="translate(248, 46)">
    <text x="0" y="0" class="serif sec">2. Data, ML &amp; Analytics Ecosystem</text>
    <text x="0" y="18" class="serif lbl">Pandas / Polars</text><text x="203" y="18" text-anchor="end" class="num val">28 repos</text>
    <text x="0" y="34" class="serif lbl">Scikit-Learn</text><text x="203" y="34" text-anchor="end" class="num val">22 repos</text>
    <text x="0" y="50" class="serif lbl">PyTorch</text><text x="203" y="50" text-anchor="end" class="num val">14 repos</text>
    <text x="0" y="66" class="serif lbl">Dependency Lockfiles</text><text x="203" y="66" text-anchor="end" class="num val">26 / 32</text>
  </g>

  <line x1="14" y1="132" x2="451" y2="132" stroke="#64748b" stroke-opacity="0.35" stroke-width="0.6"/>

  <!-- Q3: Kaggle (Supertable) -->
  <g transform="translate(14, 150)">
    <text x="0" y="0" class="serif sec">3. Kaggle Competitive Performance</text>
    <text x="0" y="18" class="serif lbl">Overall Tier</text><text x="200" y="18" text-anchor="end" class="num val" fill="#d97706">Master (#412)</text>
    <text x="0" y="34" class="serif lbl">Total Medals</text><text x="200" y="34" text-anchor="end" class="num val">39 (3G · 12S · 24B)</text>
    <text x="0" y="50" class="serif lbl">Notebooks / Datasets</text><text x="200" y="50" text-anchor="end" class="num val">#412 / #910</text>
  </g>

  <!-- Q4: Impact (Supertable + Inline Sparkline with Interquartile Band) -->
  <g transform="translate(248, 150)">
    <text x="0" y="0" class="serif sec">4. Open-Source &amp; AI Community Impact</text>
    <text x="0" y="18" class="serif lbl">Annual Contributions</text><text x="203" y="18" text-anchor="end" class="num val" fill="#059669">1,428 (+34%)</text>
    <text x="0" y="34" class="serif lbl">Total Stars Earned</text><text x="203" y="34" text-anchor="end" class="num val">★ 342 (78 forks)</text>
    <text x="0" y="54" class="serif lbl">Downloads (30d)</text>
    <rect x="118" y="46" width="82" height="12" fill="#64748b" fill-opacity="0.12"/>
    <polyline fill="none" stroke="#0284c7" stroke-width="1.2" points="118,58 125,57 132,58 140,55 147,54 155,56 162,53 170,51 177,54 185,50 192,48 200,46"/>
    <circle cx="200" cy="46" r="2.2" fill="#059669"/>
  </g>

  <line x1="14" y1="242" x2="451" y2="242" stroke="#64748b" stroke-opacity="0.7" stroke-width="0.8"/>
</svg>