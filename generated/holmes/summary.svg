<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 255" width="465" height="255">
  <style>
    .base { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .h1 { font-size: 13.5px; font-weight: 700; fill: #526071; }
    .sub { font-size: 10px; fill: #64748b; }
    .sec { font-size: 9.5px; font-weight: 700; fill: #d97706; text-transform: uppercase; letter-spacing: 0.4px; }
    .lbl { font-size: 10px; font-weight: 600; fill: #526071; }
    .val { font-size: 10px; font-weight: 700; fill: #64748b; }
  </style>
  <rect x="2" y="2" width="461" height="251" rx="6" fill="none" stroke="#64748b" stroke-opacity="0.28" stroke-width="1"/>
  <text x="14" y="22" class="base h1">Pablo Diego — Data Scientist &amp; Analytics Engineer</text>
  <text x="451" y="22" text-anchor="end" class="mono sub">32 Repos · ★ 342</text>
  <line x1="14" y1="30" x2="451" y2="30" stroke="#d97706" stroke-opacity="0.6" stroke-width="1.2"/>

  <!-- Q1: Languages -->
  <g transform="translate(14, 46)">
    <text x="0" y="0" class="base sec">1. True Source Code Proportions</text>
    <text x="0" y="18" class="base lbl">Python</text><text x="200" y="18" text-anchor="end" class="mono val" fill="#0284c7">58.4%</text>
    <text x="0" y="34" class="base lbl">SQL</text><text x="200" y="34" text-anchor="end" class="mono val">19.2%</text>
    <text x="0" y="50" class="base lbl">Go</text><text x="200" y="50" text-anchor="end" class="mono val">11.8%</text>
    <text x="0" y="66" class="base lbl">Exploration vs. Production</text><text x="200" y="66" text-anchor="end" class="mono val" fill="#059669">62% Prod / 38% EDA</text>
  </g>

  <!-- Q2: Stack -->
  <g transform="translate(248, 46)">
    <text x="0" y="0" class="base sec">2. Data, ML &amp; Analytics Ecosystem</text>
    <text x="0" y="18" class="base lbl">Pandas / Polars</text><text x="203" y="18" text-anchor="end" class="mono val">28 repos</text>
    <text x="0" y="34" class="base lbl">Scikit-Learn</text><text x="203" y="34" text-anchor="end" class="mono val">22 repos</text>
    <text x="0" y="50" class="base lbl">PyTorch</text><text x="203" y="50" text-anchor="end" class="mono val">14 repos</text>
    <text x="0" y="66" class="base lbl">Dependency Lockfiles</text><text x="203" y="66" text-anchor="end" class="mono val">26 / 32</text>
  </g>

  <line x1="14" y1="132" x2="451" y2="132" stroke="#64748b" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Q3: Kaggle -->
  <g transform="translate(14, 150)">
    <text x="0" y="0" class="base sec">3. Kaggle Competitive Performance</text>
    <text x="0" y="18" class="base lbl">Overall Tier</text><text x="200" y="18" text-anchor="end" class="mono val" fill="#d97706">Master (#412)</text>
    <text x="0" y="34" class="base lbl">Total Medals</text><text x="200" y="34" text-anchor="end" class="mono val">39 (3G · 12S · 24B)</text>
    <text x="0" y="50" class="base lbl">Notebooks / Datasets</text><text x="200" y="50" text-anchor="end" class="mono val">#412 / #910</text>
  </g>

  <!-- Q4: Impact -->
  <g transform="translate(248, 150)">
    <text x="0" y="0" class="base sec">4. Open-Source &amp; AI Community Impact</text>
    <text x="0" y="18" class="base lbl">Annual Contributions</text><text x="203" y="18" text-anchor="end" class="mono val" fill="#059669">1,428 (+34%)</text>
    <text x="0" y="34" class="base lbl">Total Stars Earned</text><text x="203" y="34" text-anchor="end" class="mono val">★ 342 (78 forks)</text>
    <text x="0" y="50" class="base lbl">Downloads (30d)</text><text x="203" y="50" text-anchor="end" class="mono val">18.4k (30d)</text>
  </g>
</svg>