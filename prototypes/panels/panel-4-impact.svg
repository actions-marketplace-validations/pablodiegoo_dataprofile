<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230">
  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .title { font-size: 13.5px; font-weight: 700; fill: #0284c7; }
    .subtitle { font-size: 10px; font-weight: 500; fill: #64748b; }
    .sec-hdr { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-val { font-size: 16.5px; font-weight: 700; fill: #526071; }
    .kpi-lbl { font-size: 10px; font-weight: 600; fill: #64748b; }
    
    
  </style>

  <rect x="2" y="2" width="436" height="226" rx="8" fill="none" stroke="#64748b" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Header -->
  <text x="16" y="24" class="font title">Open-Source &amp; AI Community Impact</text>
  <text x="16" y="39" class="font subtitle">Cross-platform reach across GitHub repositories &amp; Hugging Face Hub</text>

  <line x1="16" y1="48" x2="424" y2="48" stroke="#64748b" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Section 1: GitHub Engineering Metrics -->
  <text x="16" y="65" class="font sec-hdr" fill="#0284c7">GitHub Engineering Footprint</text>

  <g transform="translate(16, 74)">
    <rect x="0" y="0" width="96" height="52" rx="5" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="10" y="24" class="mono kpi-val">2,840</text>
    <text x="10" y="41" class="font kpi-lbl">Contributions</text>

    <rect x="104" y="0" width="96" height="52" rx="5" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="114" y="24" class="mono kpi-val">318</text>
    <text x="114" y="41" class="font kpi-lbl">Stars Earned</text>

    <rect x="208" y="0" width="96" height="52" rx="5" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="218" y="24" class="mono kpi-val">42</text>
    <text x="218" y="41" class="font kpi-lbl">Active Repos</text>

    <rect x="312" y="0" width="96" height="52" rx="5" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="322" y="24" class="mono kpi-val">14.2k</text>
    <text x="322" y="41" class="font kpi-lbl">Repo Views (14d)</text>
  </g>

  <!-- Section 2: Hugging Face Hub & Open Datasets -->
  <text x="16" y="146" class="font sec-hdr" fill="#d97706">Hugging Face Hub &amp; Published Artifacts</text>

  <g transform="translate(16, 155)">
    <rect x="0" y="0" width="96" height="56" rx="5" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="10" y="23" class="mono kpi-val">6</text>
    <text x="10" y="38" class="font kpi-lbl">Models</text>
    <text x="10" y="50" class="mono" font-size="8.5" fill="#0284c7" font-weight="600">Fine-tuned</text>

    <rect x="104" y="0" width="96" height="56" rx="5" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="114" y="23" class="mono kpi-val">11</text>
    <text x="114" y="38" class="font kpi-lbl">Datasets</text>
    <text x="114" y="50" class="mono" font-size="8.5" fill="#0284c7" font-weight="600">HF + Kaggle</text>

    <rect x="208" y="0" width="96" height="56" rx="5" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="218" y="23" class="mono kpi-val">4</text>
    <text x="218" y="38" class="font kpi-lbl">Live Spaces</text>
    <text x="218" y="50" class="mono" font-size="8.5" fill="#0284c7" font-weight="600">Gradio / St</text>

    <rect x="312" y="0" width="96" height="56" rx="5" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="322" y="23" class="mono kpi-val">18.4k</text>
    <text x="322" y="38" class="font kpi-lbl">Downloads</text>
    <text x="322" y="50" class="mono" font-size="8.5" fill="#3fb950" font-weight="700">♥ 142 Likes</text>
  </g>
</svg>
