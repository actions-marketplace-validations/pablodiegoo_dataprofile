<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230">
  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .title { font-size: 13.5px; font-weight: 700; fill: #0284c7; }
    .subtitle { font-size: 10px; font-weight: 500; fill: #64748b; }
    .th { font-size: 9.5px; font-weight: 700; fill: #0284c7; text-transform: uppercase; letter-spacing: 0.5px; }
    .cat { font-size: 11px; font-weight: 600; fill: #526071; }
    .rank { font-size: 10.5px; font-weight: 600; fill: #526071; }
    .total { font-size: 9.5px; fill: #64748b; }
    .medal-num { font-size: 11px; font-weight: 700; fill: #526071; }
    
    
  </style>

  <rect x="2" y="2" width="436" height="226" rx="8" fill="none" stroke="#64748b" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Header -->
  <text x="16" y="24" class="font title">Kaggle &amp; Competitive Data Science</text>
  <rect x="308" y="10" width="116" height="19" rx="9.5" fill="#f96517" fill-opacity="0.16" stroke="#f96517" stroke-width="1"/>
  <text x="366" y="23" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#f96517">TIER: MASTER</text>
  <text x="16" y="39" class="font subtitle">4-Category progression, global rankings &amp; verified medal tally</text>

  <!-- Overall Medal Summary Bar -->
  <g transform="translate(16, 48)">
    <rect x="0" y="0" width="408" height="26" rx="5" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="12" y="17" class="font" font-size="11" font-weight="600" fill="#64748b">Total Medals: <tspan class="medal-num">39</tspan></text>

    <circle cx="156" cy="13" r="5" fill="#d97706"/>
    <text x="166" y="17" class="mono medal-num">3 Gold</text>

    <circle cx="236" cy="13" r="5" fill="#64748b"/>
    <text x="246" y="17" class="mono medal-num">12 Silver</text>

    <circle cx="326" cy="13" r="5" fill="#d97706"/>
    <text x="336" y="17" class="mono medal-num">24 Bronze</text>
  </g>

  <!-- Table Header -->
  <g transform="translate(16, 92)">
    <text x="0" y="0" class="font th">Category</text>
    <text x="115" y="0" class="font th">Tier</text>
    <text x="205" y="0" class="font th">Global Rank</text>
    <text x="320" y="0" class="font th">Medals (G / S / B)</text>
    <line x1="0" y1="7" x2="408" y2="7" stroke="#64748b" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Row 1: Competitions -->
  <g transform="translate(16, 118)">
    <text x="0" y="0" class="font cat">Competitions</text>
    <rect x="115" y="-11" width="66" height="16" rx="3" fill="#7c3aed" fill-opacity="0.18"/>
    <text x="148" y="1" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#7c3aed">Expert</text>
    <text x="205" y="0" class="mono rank">#1,842 <tspan class="total">/ 198k</tspan></text>
    <circle cx="326" cy="-3.5" r="4" fill="#d97706"/>
    <text x="334" y="0" class="mono rank">0</text>
    <circle cx="356" cy="-3.5" r="4" fill="#64748b"/>
    <text x="364" y="0" class="mono rank">2</text>
    <circle cx="386" cy="-3.5" r="4" fill="#d97706"/>
    <text x="394" y="0" class="mono rank">5</text>
  </g>

  <!-- Row 2: Datasets -->
  <g transform="translate(16, 146)">
    <text x="0" y="0" class="font cat">Datasets</text>
    <rect x="115" y="-11" width="66" height="16" rx="3" fill="#7c3aed" fill-opacity="0.18"/>
    <text x="148" y="1" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#7c3aed">Expert</text>
    <text x="205" y="0" class="mono rank">#910 <tspan class="total">/ 64k</tspan></text>
    <circle cx="326" cy="-3.5" r="4" fill="#d97706"/>
    <text x="334" y="0" class="mono rank">1</text>
    <circle cx="356" cy="-3.5" r="4" fill="#64748b"/>
    <text x="364" y="0" class="mono rank">3</text>
    <circle cx="386" cy="-3.5" r="4" fill="#d97706"/>
    <text x="394" y="0" class="mono rank">4</text>
  </g>

  <!-- Row 3: Notebooks -->
  <g transform="translate(16, 174)">
    <text x="0" y="0" class="font cat">Notebooks</text>
    <rect x="115" y="-11" width="66" height="16" rx="3" fill="#f96517" fill-opacity="0.20"/>
    <text x="148" y="1" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#f96517">Master</text>
    <text x="205" y="0" class="mono rank">#412 <tspan class="total">/ 310k</tspan></text>
    <circle cx="326" cy="-3.5" r="4" fill="#d97706"/>
    <text x="334" y="0" class="mono rank">2</text>
    <circle cx="356" cy="-3.5" r="4" fill="#64748b"/>
    <text x="364" y="0" class="mono rank">6</text>
    <circle cx="386" cy="-3.5" r="4" fill="#d97706"/>
    <text x="394" y="0" class="mono rank">9</text>
  </g>

  <!-- Row 4: Discussions -->
  <g transform="translate(16, 202)">
    <text x="0" y="0" class="font cat">Discussions</text>
    <rect x="115" y="-11" width="66" height="16" rx="3" fill="#20beff" fill-opacity="0.18"/>
    <text x="148" y="1" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#0284c7">Contrib</text>
    <text x="205" y="0" class="mono rank">#6,210 <tspan class="total">/ 420k</tspan></text>
    <circle cx="326" cy="-3.5" r="4" fill="#d97706"/>
    <text x="334" y="0" class="mono rank">0</text>
    <circle cx="356" cy="-3.5" r="4" fill="#64748b"/>
    <text x="364" y="0" class="mono rank">1</text>
    <circle cx="386" cy="-3.5" r="4" fill="#d97706"/>
    <text x="394" y="0" class="mono rank">6</text>
  </g>
</svg>
