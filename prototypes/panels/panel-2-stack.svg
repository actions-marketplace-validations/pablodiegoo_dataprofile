<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230">
  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .title { font-size: 13.5px; font-weight: 700; fill: #0284c7; }
    .subtitle { font-size: 10px; font-weight: 500; fill: #64748b; }
    .cat-hdr { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .tool-name { font-size: 10.5px; font-weight: 600; fill: #526071; }
    .tool-count { font-size: 9.5px; font-weight: 600; fill: #64748b; }
    
    
  </style>

  <rect x="2" y="2" width="436" height="226" rx="8" fill="none" stroke="#64748b" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Header -->
  <text x="16" y="24" class="font title">Data, ML &amp; Analytics Ecosystem</text>
  <text x="424" y="24" text-anchor="end" class="mono subtitle">15 Core Libraries</text>
  <text x="16" y="39" class="font subtitle">Verified dependencies parsed from pyproject.toml, requirements.txt &amp; SQL</text>

  <line x1="16" y1="48" x2="424" y2="48" stroke="#64748b" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Column 1: Data Eng & Analytics -->
  <g transform="translate(16, 65)">
    <text x="0" y="0" class="font cat-hdr" fill="#0284c7">Data &amp; Analytics</text>

    <g transform="translate(0, 12)">
      <text x="0" y="10" class="font tool-name">Pandas</text>
      <text x="122" y="10" text-anchor="end" class="mono tool-count">18r</text>
      <rect x="0" y="15" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="15" width="110" height="5" rx="2.5" fill="#0284c7"/>

      <text x="0" y="36" class="font tool-name">PostgreSQL</text>
      <text x="122" y="36" text-anchor="end" class="mono tool-count">14r</text>
      <rect x="0" y="41" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="41" width="88" height="5" rx="2.5" fill="#0284c7"/>

      <text x="0" y="62" class="font tool-name">DuckDB</text>
      <text x="122" y="62" text-anchor="end" class="mono tool-count">9r</text>
      <rect x="0" y="67" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="67" width="60" height="5" rx="2.5" fill="#0284c7"/>

      <text x="0" y="88" class="font tool-name">Polars</text>
      <text x="122" y="88" text-anchor="end" class="mono tool-count">7r</text>
      <rect x="0" y="93" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="93" width="48" height="5" rx="2.5" fill="#0284c7"/>

      <text x="0" y="114" class="font tool-name">dbt / Spark</text>
      <text x="122" y="114" text-anchor="end" class="mono tool-count">5r</text>
      <rect x="0" y="119" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="119" width="35" height="5" rx="2.5" fill="#0284c7"/>
    </g>
  </g>

  <line x1="150" y1="56" x2="150" y2="214" stroke="#64748b" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Column 2: Machine Learning & AI -->
  <g transform="translate(162, 65)">
    <text x="0" y="0" class="font cat-hdr" fill="#7c3aed">ML &amp; Deep Learning</text>

    <g transform="translate(0, 12)">
      <text x="0" y="10" class="font tool-name">Scikit-Learn</text>
      <text x="122" y="10" text-anchor="end" class="mono tool-count">16r</text>
      <rect x="0" y="15" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="15" width="100" height="5" rx="2.5" fill="#7c3aed"/>

      <text x="0" y="36" class="font tool-name">XGBoost / LGBM</text>
      <text x="122" y="36" text-anchor="end" class="mono tool-count">11r</text>
      <rect x="0" y="41" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="41" width="72" height="5" rx="2.5" fill="#7c3aed"/>

      <text x="0" y="62" class="font tool-name">PyTorch</text>
      <text x="122" y="62" text-anchor="end" class="mono tool-count">8r</text>
      <rect x="0" y="67" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="67" width="54" height="5" rx="2.5" fill="#7c3aed"/>

      <text x="0" y="88" class="font tool-name">Transformers</text>
      <text x="122" y="88" text-anchor="end" class="mono tool-count">6r</text>
      <rect x="0" y="93" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="93" width="42" height="5" rx="2.5" fill="#7c3aed"/>

      <text x="0" y="114" class="font tool-name">Statsmodels</text>
      <text x="122" y="114" text-anchor="end" class="mono tool-count">6r</text>
      <rect x="0" y="119" width="122" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="119" width="42" height="5" rx="2.5" fill="#7c3aed"/>
    </g>
  </g>

  <line x1="296" y1="56" x2="296" y2="214" stroke="#64748b" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Column 3: Data Apps & Viz -->
  <g transform="translate(308, 65)">
    <text x="0" y="0" class="font cat-hdr" fill="#d97706">Viz &amp; Data Apps</text>

    <g transform="translate(0, 12)">
      <text x="0" y="10" class="font tool-name">Matplotlib / Sns</text>
      <text x="116" y="10" text-anchor="end" class="mono tool-count">17r</text>
      <rect x="0" y="15" width="116" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="15" width="102" height="5" rx="2.5" fill="#d97706"/>

      <text x="0" y="36" class="font tool-name">Plotly / Dash</text>
      <text x="116" y="36" text-anchor="end" class="mono tool-count">12r</text>
      <rect x="0" y="41" width="116" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="41" width="76" height="5" rx="2.5" fill="#d97706"/>

      <text x="0" y="62" class="font tool-name">Streamlit</text>
      <text x="116" y="62" text-anchor="end" class="mono tool-count">9r</text>
      <rect x="0" y="67" width="116" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="67" width="58" height="5" rx="2.5" fill="#d97706"/>

      <text x="0" y="88" class="font tool-name">Gradio</text>
      <text x="116" y="88" text-anchor="end" class="mono tool-count">5r</text>
      <rect x="0" y="93" width="116" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="93" width="34" height="5" rx="2.5" fill="#d97706"/>

      <text x="0" y="114" class="font tool-name">Altair / Vega</text>
      <text x="116" y="114" text-anchor="end" class="mono tool-count">4r</text>
      <rect x="0" y="119" width="116" height="5" rx="2.5" fill="#64748b" fill-opacity="0.16"/>
      <rect x="0" y="119" width="28" height="5" rx="2.5" fill="#d97706"/>
    </g>
  </g>
</svg>
