name: "DataProfile Portfolio SVG Generator"
description: "Generate notebook-normalized GitHub, Kaggle, and Hugging Face SVG portfolio panels across four visualization schools."
author: "Pablo Diego"
branding:
  icon: "bar-chart-2"
  color: "blue"

inputs:
  config:
    description: "Path to declarative profile.yaml manifest"
    required: false
    default: "profile.yaml"
  output:
    description: "Output directory for generated SVGs"
    required: false
    default: "generated"
  locale:
    description: "Override locale (en | pt-BR)"
    required: false
    default: ""
  demo:
    description: "Render deterministic showcase metrics without live API queries (true | false)"
    required: false
    default: "false"
  no-env:
    description: "Ignore .env and environment variable overrides and render pure profile.yaml (true | false)"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for repository and contribution queries"
    required: false
    default: ${{ github.token }}
  kaggle-username:
    description: "Optional Kaggle username for official REST API v1 enrichment"
    required: false
    default: ""
  kaggle-key:
    description: "Optional Kaggle API key or KGAT_ Bearer token"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.23"

    - name: Run DataProfile Generator
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ACCESS_TOKEN: ${{ inputs.github-token }}
        KAGGLE_USERNAME: ${{ inputs.kaggle-username }}
        KAGGLE_KEY: ${{ inputs.kaggle-key }}
      run: |
        EXTRA_ARGS=""
        VAL_ARGS=""
        if [ -n "${{ inputs.locale }}" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --locale=${{ inputs.locale }}"
        fi
        if [ "${{ inputs.demo }}" = "true" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --demo"
        fi
        if [ "${{ inputs.no-env }}" = "true" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --no-env"
          VAL_ARGS="--no-env"
        fi
        if [ -d ./cmd/dataprofile ]; then
          go run ./cmd/dataprofile generate --config=${{ inputs.config }} --output=${{ inputs.output }} $EXTRA_ARGS
          go run ./cmd/dataprofile validate --config="${{ inputs.config }}" --output="${{ inputs.output }}" $VAL_ARGS
        else
          CONFIG_ABS="$(realpath -m "${{ inputs.config }}")"
          OUTPUT_ABS="$(realpath -m "${{ inputs.output }}")"
          (cd "${{ github.action_path }}" && go run ./cmd/dataprofile generate --config="$CONFIG_ABS" --output="$OUTPUT_ABS" $EXTRA_ARGS)
          (cd "${{ github.action_path }}" && go run ./cmd/dataprofile validate --config="$CONFIG_ABS" --output="$OUTPUT_ABS" $VAL_ARGS)
        fi
